<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
  * { box-sizing: border-box; }
  form {
    width: 100%; height: 100%;
    background: #ffffff;
    border-radius: 14px;
    position: relative;
    font-family: 'Nunito', 'Segoe UI', Arial, sans-serif;
  }
  textarea {
    width: 100%; height: 100%;
    border: none; outline: none; resize: none;
    background: transparent;
    padding: 12px 14px 44px 14px;
    font-family: inherit; font-size: 16px; color: #1f4f5a;
  }
  textarea::placeholder { color: #9bb5ba; }
  button {
    position: absolute; right: 10px; bottom: 10px;
    background: #1f5f6b; color: #fff;
    border: none; border-radius: 20px;
    padding: 7px 18px;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #2a7d8c; }
  button:disabled { opacity: .6; cursor: default; }
  #msg {
    position: absolute; left: 14px; bottom: 14px;
    font-size: 13px; color: #1f5f6b; font-weight: 700;
  }
</style>
</head>
<body>
  <form id="f">
    <!-- Anti-spam y configuración -->
    <input type="hidden" name="_subject" value="Nueva respuesta recibida">
    <input type="hidden" name="_captcha" value="false">
    <input type="text" name="_honey" style="display:none">

    <textarea name="respuesta" placeholder="Escribe tu respuesta aquí..." required></textarea>
    <span id="msg"></span>
    <button type="submit" id="btn">Enviar</button>
  </form>

<script>
  // 👇 CAMBIA ESTE CORREO POR EL TUYO
  var CORREO = "TU_CORREO@gmail.com";

  var f = document.getElementById('f');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    btn.disabled = true;
    msg.textContent = "Enviando...";
    fetch("https://formsubmit.co/ajax/" + CORREO, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: new FormData(f)
    })
    .then(function (r) { return r.json(); })
    .then(function () {
      msg.textContent = "¡Enviado con éxito! 💚";
      f.querySelector('textarea').value = "";
      btn.disabled = false;
    })
    .catch(function () {
      msg.textContent = "Error, intenta de nuevo";
      btn.disabled = false;
    });
  });
</script>
</body>
